<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="manaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="#06090f" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Temporal Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#manaGrad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.85"/>
  
  <!-- Historia Hourglass / Diamond Glyph -->
  <path d="M22 18 L42 18 L34 30 L42 46 L22 46 L30 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Radiant Core Sparkle -->
  <polygon points="32,24 34,30 40,32 34,34 32,40 30,34 24,32 30,30" fill="#fbbf24"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>
